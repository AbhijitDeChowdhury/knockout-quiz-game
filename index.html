<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Java Knockout Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Java Knockout Quiz</h1>
    <p class="rule">
      Rule: One Wrong Answer = Game Over
    </p>

    <div class="quiz-box">
      <h2 id="question">Question Here</h2>

      <div class="options" id="options">
      </div>

      <p id="result"></p>
    </div>

    <div class="score-box" id="scoreBox">
      <h2>Quiz Over</h2>
      <p id="finalScore"></p>
      <p id="level"></p>

      <button onclick="restartQuiz()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
